<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Pothole Detection & Reporting</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --background: #f1f5f9;
            --surface: #ffffff;
            --surface-secondary: #f8fafc;
            --text: #0f172a;
            --heading: #0f172a;
            --muted: #475569;
            --border: #cbd5e1;
            --button: #0f172a;
            --button-hover: #1e293b;
            --focus: #0284c7;
            --focus-ring: rgba(2, 132, 199, 0.25);
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }
        body.dark-mode {
            --background: #0b1120;
            --surface: #131c2e;
            --surface-secondary: #1a263d;
            --text: #f1f5f9;
            --heading: #f8fafc;
            --muted: #94a3b8;
            --border: #2d3b55;
            --button: #e2e8f0;
            --button-hover: #ffffff;
            --focus: #38bdf8;
            --focus-ring: rgba(56, 189, 248, 0.3);
            --danger-bg: #450a0a;
            --danger-text: #fca5a5;
            --success-bg: #052e16;
            --success-text: #86efac;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .auth-card h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--heading);
            text-align: center;
        }
        .auth-card p.subtitle {
            margin: 0 0 24px 0;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(132,32,41,0.2);
        }
        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid rgba(15,81,50,0.2);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--heading);
        }
        .form-group input {
            width: 100%;
            padding: 11px 13px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: var(--button);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            margin-top: 6px;
        }
        body.dark-mode .btn-submit {
            color: #0f172a;
        }
        .btn-submit:hover {
            background: var(--button-hover);
        }
        .btn-submit:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }
        .auth-footer a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--heading); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Sign In</h1>
        <p class="subtitle">Access your citizen reports or municipal triage portal</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create a citizen account</a>
        </div>
        <a href="/" class="back-link">← Return to Home</a>
    </div>

    <script>
        (function() {
            if (localStorage.getItem("potholeTheme") === "dark") {
                document.body.classList.add("dark-mode");
            }
        })();
    </script>
</body>
</html>
